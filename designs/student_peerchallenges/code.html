<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduPremium - Quiz Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#004395",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface": "#191c1e",
                        "secondary-fixed": "#6bff8f",
                        "on-primary-fixed": "#001b3c",
                        "surface-tint": "#455f88",
                        "on-error-container": "#93000a",
                        "surface-container": "#eceef0",
                        "inverse-primary": "#adc7f7",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#4ae176",
                        "outline-variant": "#c4c6cf",
                        "tertiary-fixed": "#d8e2ff",
                        "background": "#f7f9fb",
                        "on-primary-fixed-variant": "#2d476f",
                        "primary-container": "#1a365d",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#43474e",
                        "on-secondary-container": "#007432",
                        "on-secondary-fixed-variant": "#005321",
                        "surface-bright": "#f7f9fb",
                        "on-primary-container": "#86a0cd",
                        "inverse-surface": "#2d3133",
                        "tertiary-container": "#003374",
                        "surface-variant": "#e0e3e5",
                        "surface-container-high": "#e6e8ea",
                        "secondary": "#006e2f",
                        "secondary-container": "#6bff8f",
                        "primary": "#002045",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "on-primary": "#ffffff",
                        "tertiary": "#001f4b",
                        "primary-fixed-dim": "#adc7f7",
                        "on-tertiary-container": "#6a9dff",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed": "#d6e3ff",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#002109",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "outline": "#74777f",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-tertiary-fixed": "#001a42"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "margin-mobile": "16px",
                        "base": "8px",
                        "gutter": "24px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-xl": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .option-radio:checked + label {
            background-color: theme('colors.primary-fixed');
            border-color: theme('colors.primary');
        }
        .option-radio:checked + label .check-circle {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }
        .option-radio:checked + label .check-circle span {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Header (Focused Quiz Mode) -->
<header class="bg-surface/80 border-b border-white/20 backdrop-blur-xl shadow-sm fixed top-0 left-0 w-full z-50">
<div class="px-margin-desktop py-4 max-w-container-max mx-auto flex justify-between items-center">
<div class="flex items-center gap-4">
<a aria-label="Exit Quiz" class="text-on-surface-variant hover:text-primary transition-colors flex items-center" href="#">
<span class="material-symbols-outlined mr-2">close</span>
<span class="hidden md:inline font-label-md text-label-md">Exit Quiz</span>
</a>
<div class="h-6 w-px bg-outline-variant hidden md:block"></div>
<div>
<h1 class="font-headline-md text-headline-md text-primary truncate max-w-[200px] md:max-w-md">Introduction to Game Theory</h1>
<div class="flex items-center gap-2 mt-1">
<span class="font-label-sm text-label-sm text-on-surface-variant">Question 2 of 10</span>
<span class="px-2 py-0.5 bg-surface-container-highest text-on-surface-variant rounded-full font-label-sm text-label-sm border border-outline-variant">Medium</span>
</div>
</div>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 bg-surface-container-lowest px-4 py-2 rounded-full shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-primary">timer</span>
<span class="font-label-md text-label-md text-on-surface font-mono tracking-widest">08:00</span>
</div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-[100px] pb-24 px-margin-mobile md:px-margin-desktop max-w-4xl mx-auto w-full flex flex-col gap-8">
<!-- Progress Area -->
<section class="glass-panel rounded-xl p-6 flex flex-col gap-4 relative overflow-hidden">
<!-- Animated background element for progress card -->
<div class="absolute -top-10 -right-10 w-40 h-40 bg-secondary-fixed/20 rounded-full blur-3xl"></div>
<div class="flex justify-between items-end relative z-10">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Progress</p>
<p class="font-headline-md text-headline-md text-primary">20% Complete</p>
</div>
<p class="font-label-md text-label-md text-on-surface-variant">8 Questions Remaining</p>
</div>
<!-- Progress Bar -->
<div class="w-full bg-surface-container-highest rounded-full h-3 relative overflow-hidden z-10">
<div class="bg-secondary h-3 rounded-full transition-all duration-1000 ease-out relative" style="width: 20%;">
<!-- Pulse effect on the head of the progress bar -->
<div class="absolute right-0 top-0 bottom-0 w-8 bg-white/30 rounded-r-full animate-pulse"></div>
</div>
</div>
</section>
<!-- Main Question Card -->
<section class="glass-panel rounded-2xl p-8 md:p-12 shadow-lg relative">
<div class="mb-8">
<span class="inline-block px-3 py-1 bg-tertiary-fixed text-on-tertiary-fixed rounded-full font-label-sm text-label-sm mb-4">Module 1: Foundations</span>
<h2 class="font-headline-lg text-headline-lg md:font-headline-xl md:text-headline-xl text-on-surface leading-tight">
                    In a simultaneous move game, what defines a "Nash Equilibrium"?
                </h2>
</div>
<!-- Answer Options -->
<form class="flex flex-col gap-4">
<!-- Option A -->
<div class="relative group">
<input class="peer sr-only option-radio" id="option_a" name="q2" type="radio" value="A"/>
<label class="flex items-center p-6 border-2 border-outline-variant rounded-xl cursor-pointer transition-all duration-200 hover:bg-surface-container-lowest hover:border-primary/50 group-hover:shadow-md" for="option_a">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 mr-4 flex items-center justify-center check-circle transition-colors">
<span class="material-symbols-outlined text-[16px] text-white opacity-0 transition-opacity">check</span>
</div>
<div class="flex-grow">
<span class="font-label-md text-label-md text-on-surface-variant mr-3 inline-block w-6 text-center bg-surface-container rounded">A</span>
<span class="font-body-lg text-body-lg text-on-surface">A set of strategies where no player has an incentive to unilaterally deviate.</span>
</div>
</label>
</div>
<!-- Option B -->
<div class="relative group">
<input checked="" class="peer sr-only option-radio" id="option_b" name="q2" type="radio" value="B"/>
<label class="flex items-center p-6 border-2 border-outline-variant rounded-xl cursor-pointer transition-all duration-200 hover:bg-surface-container-lowest hover:border-primary/50 group-hover:shadow-md" for="option_b">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 mr-4 flex items-center justify-center check-circle transition-colors">
<span class="material-symbols-outlined text-[16px] text-white opacity-0 transition-opacity">check</span>
</div>
<div class="flex-grow">
<span class="font-label-md text-label-md text-on-surface-variant mr-3 inline-block w-6 text-center bg-surface-container rounded">B</span>
<span class="font-body-lg text-body-lg text-on-surface">The outcome that maximizes total payoffs for all players combined.</span>
</div>
</label>
</div>
<!-- Option C -->
<div class="relative group">
<input class="peer sr-only option-radio" id="option_c" name="q2" type="radio" value="C"/>
<label class="flex items-center p-6 border-2 border-outline-variant rounded-xl cursor-pointer transition-all duration-200 hover:bg-surface-container-lowest hover:border-primary/50 group-hover:shadow-md" for="option_c">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 mr-4 flex items-center justify-center check-circle transition-colors">
<span class="material-symbols-outlined text-[16px] text-white opacity-0 transition-opacity">check</span>
</div>
<div class="flex-grow">
<span class="font-label-md text-label-md text-on-surface-variant mr-3 inline-block w-6 text-center bg-surface-container rounded">C</span>
<span class="font-body-lg text-body-lg text-on-surface">A strategy that always yields a higher payoff regardless of the opponent's choice.</span>
</div>
</label>
</div>
<!-- Option D -->
<div class="relative group">
<input class="peer sr-only option-radio" id="option_d" name="q2" type="radio" value="D"/>
<label class="flex items-center p-6 border-2 border-outline-variant rounded-xl cursor-pointer transition-all duration-200 hover:bg-surface-container-lowest hover:border-primary/50 group-hover:shadow-md" for="option_d">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 mr-4 flex items-center justify-center check-circle transition-colors">
<span class="material-symbols-outlined text-[16px] text-white opacity-0 transition-opacity">check</span>
</div>
<div class="flex-grow">
<span class="font-label-md text-label-md text-on-surface-variant mr-3 inline-block w-6 text-center bg-surface-container rounded">D</span>
<span class="font-body-lg text-body-lg text-on-surface">When players alternate turns until a stable outcome is reached.</span>
</div>
</label>
</div>
</form>
</section>
<!-- Question Navigator (Bottom Strip) -->
<div class="flex justify-center flex-wrap gap-2 py-4">
<button aria-label="Go to Question 1 (Answered)" class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md flex items-center justify-center shadow-sm hover:scale-105 transition-transform">1</button>
<button aria-label="Current Question 2" class="w-10 h-10 rounded-full bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center shadow-md ring-2 ring-primary ring-offset-2 ring-offset-background hover:scale-105 transition-transform">2</button>
<button aria-label="Go to Question 3" class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md flex items-center justify-center hover:bg-surface-container-high transition-colors">3</button>
<button aria-label="Go to Question 4" class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md flex items-center justify-center hover:bg-surface-container-high transition-colors">4</button>
<button aria-label="Go to Question 5" class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md flex items-center justify-center hover:bg-surface-container-high transition-colors">5</button>
<button aria-label="Go to Question 6" class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md flex items-center justify-center hover:bg-surface-container-high transition-colors hidden sm:flex">6</button>
<div class="w-10 h-10 flex items-center justify-center text-outline hidden sm:flex">...</div>
<button aria-label="Go to Question 10" class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md flex items-center justify-center hover:bg-surface-container-high transition-colors">10</button>
</div>
</main>
<!-- Navigation Controls (Fixed Bottom) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant py-4 px-margin-mobile md:px-margin-desktop z-40">
<div class="max-w-4xl mx-auto flex justify-between items-center">
<button class="px-6 py-3 border border-outline rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-lowest hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined">arrow_back</span>
                Previous
            </button>
<div class="text-center hidden md:block">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px] text-secondary">cloud_done</span>
                    Progress Saved Automatically
                </p>
</div>
<button class="px-8 py-3 bg-primary text-on-primary rounded-lg font-label-md text-label-md shadow-md hover:bg-primary-container hover:text-on-primary-container hover:-translate-y-0.5 transition-all flex items-center gap-2">
                Next
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>
