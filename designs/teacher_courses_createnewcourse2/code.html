<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Course Structure - EduNext</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-dim": "#d9dadc",
                      "inverse-surface": "#2e3132",
                      "surface-container-high": "#e7e8ea",
                      "inverse-on-surface": "#f0f1f3",
                      "surface-variant": "#e1e2e4",
                      "on-tertiary-container": "#fffbff",
                      "on-surface-variant": "#3e4a3e",
                      "secondary": "#405f91",
                      "on-tertiary-fixed-variant": "#3323cc",
                      "outline-variant": "#bdcabb",
                      "surface": "#f8f9fb",
                      "surface-container": "#edeef0",
                      "primary-container": "#008740",
                      "secondary-container": "#a6c5fe",
                      "on-error-container": "#93000a",
                      "on-tertiary": "#ffffff",
                      "inverse-primary": "#62de85",
                      "on-secondary-container": "#315182",
                      "on-secondary": "#ffffff",
                      "on-background": "#191c1e",
                      "on-tertiary-fixed": "#0f0069",
                      "background": "#f8f9fb",
                      "tertiary-fixed": "#e2dfff",
                      "on-primary-fixed-variant": "#005225",
                      "primary": "#006b31",
                      "surface-bright": "#f8f9fb",
                      "surface-container-low": "#f3f4f6",
                      "on-surface": "#191c1e",
                      "tertiary-fixed-dim": "#c3c0ff",
                      "tertiary-container": "#645efb",
                      "surface-tint": "#006d33",
                      "secondary-fixed-dim": "#a9c7ff",
                      "primary-fixed": "#7ffb9f",
                      "on-primary-fixed": "#00210b",
                      "primary-fixed-dim": "#62de85",
                      "on-secondary-fixed-variant": "#264778",
                      "surface-container-highest": "#e1e2e4",
                      "surface-container-lowest": "#ffffff",
                      "error": "#ba1a1a",
                      "tertiary": "#4b41e1",
                      "on-secondary-fixed": "#001b3d",
                      "outline": "#6e7a6d",
                      "on-error": "#ffffff",
                      "on-primary-container": "#f7fff3",
                      "error-container": "#ffdad6",
                      "secondary-fixed": "#d6e3ff",
                      "on-primary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "1.5rem",
                      "stack-md": "1.5rem",
                      "stack-lg": "2.5rem",
                      "margin-mobile": "1rem",
                      "stack-sm": "0.5rem",
                      "container-max": "1280px"
              },
              "fontFamily": {
                      "label-bold": [
                              "Inter"
                      ],
                      "headline-lg-mobile": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-lg": [
                              "Plus Jakarta Sans"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "label-sm": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "label-bold": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg-mobile": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-sm": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "fontWeight": "500"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .module-card { transition: all 0.2s ease-in-out; }
        .module-card.dragging { opacity: 0.5; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen flex overflow-hidden">
<!-- TopAppBar & Canvas Container -->
<div class="flex-1 flex flex-col h-full overflow-hidden ml-0">
<!-- TopAppBar (Transactional - No Nav Elements, Just Brand & Close) -->
<header class="flex justify-between items-center w-full px-gutter h-20 bg-background border-b border-outline-variant shrink-0">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="font-headline-lg text-headline-lg font-bold text-primary">EduNext</div>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant font-label-bold text-label-bold hover:bg-surface-container-low px-4 py-2 rounded-lg transition-colors">Save Draft</button>
<button class="bg-primary text-on-primary font-label-bold text-label-bold px-6 py-2 rounded-lg hover:bg-surface-tint transition-colors">Continue</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-gutter py-8">
<div class="max-w-container-max mx-auto h-full flex flex-col gap-8">
<!-- Stepper -->
<div class="w-full max-w-3xl mx-auto flex items-center justify-between relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-surface-variant -z-10 rounded-full"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/3 h-1 bg-primary -z-10 rounded-full transition-all duration-300"></div>
<!-- Step 1 (Completed) -->
<div class="flex flex-col items-center gap-2 bg-background px-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Basic Info</span>
</div>
<!-- Step 2 (Active) -->
<div class="flex flex-col items-center gap-2 bg-background px-2">
<div class="w-8 h-8 rounded-full border-2 border-primary bg-primary-container text-on-primary-container flex items-center justify-center font-label-bold text-label-bold">
                            2
                        </div>
<span class="font-label-sm text-label-sm text-primary font-bold">Course Structure</span>
</div>
<!-- Step 3 (Pending) -->
<div class="flex flex-col items-center gap-2 bg-background px-2">
<div class="w-8 h-8 rounded-full border-2 border-surface-variant bg-surface text-on-surface-variant flex items-center justify-center font-label-bold text-label-bold">
                            3
                        </div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Settings</span>
</div>
<!-- Step 4 (Pending) -->
<div class="flex flex-col items-center gap-2 bg-background px-2">
<div class="w-8 h-8 rounded-full border-2 border-surface-variant bg-surface text-on-surface-variant flex items-center justify-center font-label-bold text-label-bold">
                            4
                        </div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Publish</span>
</div>
</div>
<!-- Content Area -->
<div class="flex-1 w-full max-w-4xl mx-auto flex flex-col gap-stack-lg">
<div class="flex flex-col gap-2 text-center md:text-left">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Build your course curriculum</h1>
<p class="text-on-surface-variant max-w-2xl">Organize your course into manageable modules and lessons. Drag and drop to reorder.</p>
</div>
<!-- Builder Container -->
<div class="flex flex-col gap-6" id="course-builder">
<!-- Module 1 -->
<div class="module-card bg-surface border border-outline-variant rounded-xl overflow-hidden flex flex-col">
<!-- Module Header -->
<div class="bg-surface-container-low p-4 border-b border-outline-variant flex items-center gap-4">
<div class="drag-handle text-on-surface-variant hover:text-on-surface p-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">drag_indicator</span>
</div>
<div class="flex-1 flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wide font-bold">Module 1</span>
</div>
<input class="w-full bg-transparent border-none p-0 text-on-surface font-label-bold text-label-bold focus:ring-0 focus:outline-none placeholder-on-surface-variant/50" placeholder="Module Title" type="text" value="Introduction to Advanced Mathematics"/>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Edit Module Settings">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-container-high text-error transition-colors" title="Delete Module">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">delete</span>
</button>
</div>
</div>
<!-- Lessons Container -->
<div class="p-4 flex flex-col gap-3 pl-12 bg-surface">
<!-- Lesson 1 -->
<div class="group flex items-center gap-3 p-3 rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-primary/50 transition-colors">
<div class="drag-handle text-outline hover:text-on-surface p-1">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">drag_indicator</span>
</div>
<div class="w-8 h-8 rounded bg-primary-container/20 text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">play_circle</span>
</div>
<div class="flex-1">
<input class="w-full bg-transparent border-none p-0 text-on-surface text-sm focus:ring-0 focus:outline-none" placeholder="Lesson Title" type="text" value="Core Concepts Review"/>
</div>
<div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
<button class="p-1.5 rounded-md hover:bg-surface-container text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">edit</span>
</button>
<button class="p-1.5 rounded-md hover:bg-error-container text-error">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
</div>
<!-- Lesson 2 -->
<div class="group flex items-center gap-3 p-3 rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-primary/50 transition-colors">
<div class="drag-handle text-outline hover:text-on-surface p-1">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">drag_indicator</span>
</div>
<div class="w-8 h-8 rounded bg-secondary-container/30 text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<div class="flex-1">
<input class="w-full bg-transparent border-none p-0 text-on-surface text-sm focus:ring-0 focus:outline-none" placeholder="Lesson Title" type="text" value="Diagnostic Assessment"/>
</div>
<div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
<button class="p-1.5 rounded-md hover:bg-surface-container text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">edit</span>
</button>
<button class="p-1.5 rounded-md hover:bg-error-container text-error">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
</div>
<!-- Add Lesson Button -->
<button class="mt-2 flex items-center gap-2 text-primary hover:text-surface-tint font-label-bold text-label-bold w-fit px-2 py-1 rounded-md hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
                                    Add Lesson
                                </button>
</div>
</div>
<!-- Module 2 -->
<div class="module-card bg-surface border border-outline-variant rounded-xl overflow-hidden flex flex-col">
<!-- Module Header -->
<div class="bg-surface-container-low p-4 border-b border-outline-variant flex items-center gap-4">
<div class="drag-handle text-on-surface-variant hover:text-on-surface p-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">drag_indicator</span>
</div>
<div class="flex-1 flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wide font-bold">Module 2</span>
</div>
<input class="w-full bg-transparent border-none p-0 text-on-surface font-label-bold text-label-bold focus:ring-0 focus:outline-none placeholder-on-surface-variant/50" placeholder="Module Title" type="text" value="Linear Algebra Fundamentals"/>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Edit Module Settings">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-container-high text-error transition-colors" title="Delete Module">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">delete</span>
</button>
</div>
</div>
<!-- Lessons Container -->
<div class="p-4 flex flex-col gap-3 pl-12 bg-surface">
<!-- Add Lesson Button (Empty State conceptually) -->
<button class="flex items-center justify-center gap-2 text-on-surface-variant hover:text-primary font-label-bold text-label-bold w-full py-4 border-2 border-dashed border-outline-variant hover:border-primary/50 rounded-lg bg-surface-container-lowest hover:bg-primary-container/5 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add_circle</span>
                                    Add First Lesson
                                </button>
</div>
</div>
</div>
<!-- Add Module Button -->
<button class="w-full flex items-center justify-center gap-2 py-6 border-2 border-dashed border-outline hover:border-primary rounded-xl text-on-surface-variant hover:text-primary font-label-bold text-label-bold bg-surface-container-lowest hover:bg-primary-container/5 transition-all">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">add_box</span>
                        Add New Module
                    </button>
</div>
</div>
</main>
</div>
</body></html>
